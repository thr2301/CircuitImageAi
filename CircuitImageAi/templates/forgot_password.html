<!DOCTYPE html>
<html>
<head>
  <title>Reset Password - Circuit AI</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="login-box">
    <h2>Reset Password</h2>
    <p style="margin-bottom:15px; font-size:14px; color:#666;">Enter your registered email to set a new password.</p>
    <form method="post" action="/forgot-password">
      <input type="email" name="email" placeholder="Registered Email" required><br>
      <input type="password" name="new_password" placeholder="New Password" required><br>
      <button type="submit">Reset Password</button>
    </form>
    <p style="margin-top:20px;"><a href="/">Back to Login</a></p>
  </div> 
</body>
</html>
