<!DOCTYPE html>
<html>
<head>
  <title>Register - Circuit AI</title>
  <link rel="stylesheet" href="/static/style.css?v=5">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="Register-box">
    <h2>Register</h2>
    <form method="post" action="/register">
      <input type="text" name="username" placeholder="Username" required><br>
      <input type="password" name="password" placeholder="Password" required><br>
      <input type="email" name="email" placeholder="Email" required><br>
      <input type="text" name="phone" placeholder="Phone (optional)"><br>
      <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="/">Login here</a></p>
    <div class="social-bar">
      <a href="https://www.linkedin.com/in/athanasios-roudis-3a2932260/" target="_blank"><i class="fab fa-linkedin"></i></a>
      <a href="https://github.com/thr2301" target="_blank"><i class="fab fa-github"></i></a>
      <a href="https://instagram.com/th_roudis" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://facebook.com/thanos.roudis" target="_blank"><i class="fab fa-facebook"></i></a>
    </div>
  </div>
</body>
</html>
